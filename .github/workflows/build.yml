name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK (Automated & Licensed)
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false

    - name: Pre-install Android Build Tools and AIDL
      run: |
        # On force l'installation de la version requise par Buildozer pour éviter le bug
        sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
