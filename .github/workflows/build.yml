name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        # On force Buildozer à utiliser une version stable du NDK et à accepter les licences
        export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
        buildozer android debug
      env:
        # Variable officielle pour valider les outils récents sans passer par la commande "yes"
        AUTO_ACCEPT_LICENSE: "1"
