name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        # Nettoyage préventif pour éviter l'erreur de dossier manquant ou corrompu
        rm -rf $HOME/.buildozer
        
        # Lancement de la compilation propre
        buildozer android debug
      env:
        # Configuration absolue pour accepter automatiquement toutes les licences Android en tâche de fond
        AUTO_ACCEPT_LICENSE: "1"
        GRADLE_OPTS: "-Dorg.gradle.welcome.provider.enabled=false"
