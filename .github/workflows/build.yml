name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer cython

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Télécharge et utilise l'outil officiel pour accepter toutes les licences à l'avance
        yes | sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        # On utilise "yes" pour valider automatiquement toute demande interactive de Buildozer
        yes | buildozer android debug
