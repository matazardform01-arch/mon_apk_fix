name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        # Création de l'arborescence attendue par Buildozer
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        
        # On crée un script vide nommé 'aidl' qui renvoie succès (0) immédiatement
        echo -e '#!/bin/sh\nexit 0' > $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        chmod +x $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        
        # Lancement de la compilation
        buildozer android debug
      env:
        AUTO_ACCEPT_LICENSE: "1"
